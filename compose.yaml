name: phoneshim

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phoneshim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phoneshim-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-phoneshim}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migration:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-phoneshim}:${POSTGRES_PASSWORD:-phoneshim-local-password}@db:5432/${POSTGRES_DB:-phoneshim}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-phoneshim}:${POSTGRES_PASSWORD:-phoneshim-local-password}@db:5432/${POSTGRES_DB:-phoneshim}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-access-secret}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-1h}
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
